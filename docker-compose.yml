version: "3.8"

services:
  # Go backend
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.dev
    container_name: openmedia-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - nutsdb_data:/app/data/nutsdb
    environment:
      - DB_PATH=/app/data/nutsdb
      - SERVER_ADDRESS=:8080
      - CORS_ALLOW_ORIGINS=http://localhost:5173,http://localhost:3000
      - APP_ENV=development
      - TVDB_API_KEY=${TVDB_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - RUTORRENT_URL=${RUTORRENT_URL:-}
      - RUTORRENT_USERNAME=${RUTORRENT_USERNAME:-}
      - RUTORRENT_PASSWORD=${RUTORRENT_PASSWORD:-}

  # Frontend development server
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
    container_name: openmedia-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=/api
    depends_on:
      - backend

volumes:
  nutsdb_data:
    driver: local
