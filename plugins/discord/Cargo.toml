[package]
name = "discord"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Plugins build on their own, outside the main workspace.
[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
