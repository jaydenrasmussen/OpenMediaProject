id = "discord"
name = "Discord"
version = "0.1.0"
kind = "notification"
wasm = "discord.wasm"
description = "Sends each event as a message to a Discord channel webhook."
# Discord webhooks only ever post to discord.com, so we do not need "*".
allowed_hosts = ["discord.com", "discordapp.com", "ptb.discord.com", "canary.discord.com"]
