[advisories]
version = 2

[licenses]
version = 2
# GPL-3.0 project: permissive and weak-copyleft licences are compatible.
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "GPL-3.0-only", "GPL-3.0-or-later",
    "LGPL-3.0-only", "LGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
