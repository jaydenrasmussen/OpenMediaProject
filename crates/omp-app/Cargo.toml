[package]
name = "omp-app"
description = "Application composition: state, background tasks and the HTTP API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
argon2 = "0.5"
axum.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
fs4 = "0.13"
getrandom = "0.3"
omp-core = { path = "../omp-core" }
omp-library = { path = "../omp-library" }
omp-db = { path = "../omp-db" }
omp-decision = { path = "../omp-decision" }
omp-downloads = { path = "../omp-downloads" }
omp-indexers = { path = "../omp-indexers" }
omp-metadata = { path = "../omp-metadata" }
omp-naming = { path = "../omp-naming" }
omp-parser = { path = "../omp-parser" }
omp-plugin-host = { path = "../omp-plugin-host" }
omp-quality = { path = "../omp-quality" }
omp-services = { path = "../omp-services" }
omp-torrent = { path = "../omp-torrent" }
omp-usenet = { path = "../omp-usenet" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tokio-tungstenite = "0.28"
futures-util = "0.3"
tempfile = "3"

[lints]
workspace = true
