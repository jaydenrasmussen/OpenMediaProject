[package]
name = "omp-plugin-host"
description = "WASM plugin runtime for OpenMediaProject"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.9"
async-trait = "0.1.92"
tokio.workspace = true
tracing.workspace = true
url = "2.5.8"
# Every default feature but `cache`: the host never turns the compiled-code
# cache on, and it is the only user of the zstd crate.
wasmtime = { version = "49", default-features = false, features = ["anyhow", "async", "backtrace", "gc", "gc-copying", "gc-drc", "gc-null", "wat", "profiling", "parallel-compilation", "cranelift", "pooling-allocator", "demangle", "addr2line", "coredump", "debug-builtins", "runtime", "component-model", "component-model-async", "threads", "stack-switching", "std", "debug", "compile-time-builtins", "wit-parser"] }
wasmtime-wasi = "49"

[lints]
workspace = true

[dev-dependencies]
omp-net = { path = "../omp-net" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tempfile = "3"
serde_json = "1"
