name: PR

on:
  pull_request:
  push:
    branches: [main, rust-rewrite]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug info makes the many test binaries large enough to exhaust the runner's disk and memory at link time.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      # Tests that drive the real tools skip themselves when these are missing.
      - run: sudo apt-get update && sudo apt-get install -y par2 7zip ffmpeg
      - run: python3 scripts/check_audit.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace 2>&1 | tee test-output.log
        shell: bash # pipefail, so a failing test still fails the job
      - run: python3 scripts/check_audit.py test-output.log

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd ui && npm ci && npm run build
      - run: cargo build --release -p omp-server
      - run: cd e2e && npm install && npx playwright install --with-deps chromium
      - run: |
          # TMDB is replaced by a stand-in serving captured responses, so no token is needed.
          node e2e/fake-tmdb.mjs 18500 &
          TMDB_READ_TOKEN=fake OMP_TMDB_BASE_URL=http://127.0.0.1:18500 OMP_SKYHOOK=off \
            OMP_DATA_DIR="$(mktemp -d)" OMP_ADDR=127.0.0.1:8080 ./target/release/omp-server &
          sleep 5
          cd e2e && OMP_URL=http://127.0.0.1:8080 npx playwright test
